[metadata]
name = my_chat_app
version = 0.1.0
author = Project Author
author_email = author@example.com
description = A simple Flask chat application using Gemini API.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/projectauthor/my_chat_app
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.7
install_requires =
    Flask
    google-generativeai

[options.packages.find]
where = src
